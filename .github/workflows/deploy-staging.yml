name: Deploy staging

on:
  workflow_dispatch:

concurrency:
  group: boomrider-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run security:check
      - run: npm run build
      - run: npm run release:check

      - name: Install Playwright Browsers for CI
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Configure staging Edge Function secrets
        env:
          APP_ORIGIN: ${{ vars.STAGING_APP_ORIGIN }}
          GEMINI_API_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.STAGING_GEMINI_MODEL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NOTIFICATION_WEBHOOK_SECRET: ${{ secrets.NOTIFICATION_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        shell: bash
        run: |
          supabase secrets set \
            APP_ORIGIN="$APP_ORIGIN" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            GEMINI_MODEL="$GEMINI_MODEL" \
            FIREBASE_SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_JSON" \
            NOTIFICATION_WEBHOOK_SECRET="$NOTIFICATION_WEBHOOK_SECRET" \
            CRON_SECRET="$CRON_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply forward database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy authenticated AI function to staging
        run: supabase functions deploy ai-chat --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy push notification function to staging
        run: supabase functions deploy send-notification --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy expired job offers background function to staging
        run: supabase functions deploy process-expired-offers --project-ref "$SUPABASE_PROJECT_REF"

      - name: Pull Vercel staging configuration
        run: npx vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build Vercel artifact
        run: npx vercel build --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy Vercel staging artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify staging deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel curl / \
            --deployment "${{ steps.deploy.outputs.url }}" \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --fail --silent --show-error \
            --output /tmp/boomrider-staging.html \
            --dump-header /tmp/boomrider-staging.headers
          npm run smoke -- \
            "${{ steps.deploy.outputs.url }}" \
            /tmp/boomrider-staging.html \
            /tmp/boomrider-staging.headers
