name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run security:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare the documented baseline for an isolated rebuild
        run: cp supabase_schema.sql supabase/migrations/000_baseline_schema.sql
      - name: Start isolated local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Rebuild database from every migration
        run: supabase db reset
