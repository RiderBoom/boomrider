name: Security CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run security:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Prepare the documented baseline for an isolated rebuild
        run: |
          cp supabase_schema.sql supabase/migrations/000_baseline_schema.sql
          # Migration 002 owns this publication entry; avoid defining it twice.
          sed -i '/alter publication supabase_realtime add table public.orders;/d' supabase/migrations/000_baseline_schema.sql
      - name: Start isolated local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Rebuild database from every migration
        run: supabase db reset
